name: Update fundraising progress

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total from Givebutter
        run: node scripts/fetch-progress.mjs
        env:
          GIVEBUTTER_API_KEY: ${{ secrets.GIVEBUTTER_API_KEY }}
          GIVEBUTTER_CAMPAIGN_ID: ${{ secrets.GIVEBUTTER_CAMPAIGN_ID }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update fundraising progress"
            git push
          fi
