<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Tree Sky — Fundraiser</title>
  <meta name="description" content="Help Rock Tree Sky reach our $10,000 goal.">
  <!-- Fonts are added by script.js from the Fonts section of settings.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Each text section's words come from its own file in the text folder
       (named in data-md); what's written here only shows if it can't load. -->
  <!-- The bar across the top: the logo (LOGO_IMAGE in settings.md) and the title -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="logo" hidden></a>
      <div class="title-block content" data-md="text/title.md">
        <h1>Rock Tree Sky</h1>
      </div>
    </div>
  </header>

  <main class="page">

    <!-- 1. The route map (map.js) | text | the donation form -->
    <section class="row row-top">
      <div class="map-col"><div class="route-map-slot"></div></div>
      <div class="content" data-md="text/beside-form.md"></div>
      <!-- Zeffy donation form: script.js puts it here from ZEFFY_FORM_LINK in settings.md -->
      <div class="donate" aria-label="Donate">
        <div class="form-placeholder">Zeffy donation form goes here<br>(add its link to ZEFFY_FORM_LINK in settings.md)</div>
      </div>
    </section>

    <!-- 2. Text | a picture (SIDE_PICTURE in settings.md) -->
    <section class="row row-picture">
      <div class="content" data-md="text/beside-picture.md"></div>
      <div class="side-picture">
        <div class="picture-placeholder">Picture goes here<br>(put its file name in SIDE_PICTURE in settings.md)</div>
      </div>
    </section>

    <!-- 3. Text | text -->
    <section class="row">
      <div class="content" data-md="text/bottom-left.md"></div>
      <div class="content" data-md="text/bottom-right.md"></div>
    </section>

  </main>

  <script src="markdown.js"></script>
  <script src="map.js"></script>
  <script src="script.js"></script>
</body>
</html>
