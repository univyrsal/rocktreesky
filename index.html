<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Tree Sky — Fundraiser</title>
  <meta name="description" content="Help Rock Tree Sky reach our $10,000 goal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Thermometer: numbers come from progress.json (updated by the GitHub Action) -->
    <section class="progress" aria-labelledby="progress-heading">
      <h1 id="progress-heading">Rock Tree Sky</h1>
      <p class="tagline">Help us reach our goal.</p>

      <div class="thermometer" role="progressbar" aria-valuemin="0" aria-valuemax="10000" aria-valuenow="0" aria-label="Amount raised">
        <div class="bulb"><div class="bulb-fill"></div></div>
        <div class="tube">
          <div class="fill"></div>
          <div class="ticks" aria-hidden="true"></div>
        </div>
      </div>

      <div class="totals">
        <p><span class="raised">$0</span> raised of <span class="goal">$10,000</span></p>
        <p class="donors"></p>
      </div>
    </section>

    <!-- EDIT: replace with your own story -->
    <section class="about">
      <p>Tell people what the money is for and why it matters. A few sentences is plenty.</p>
    </section>

    <!-- Givebutter widget: paste your widget snippet here (see README) -->
    <section class="donate" aria-label="Donate">
      <div class="widget-placeholder">Givebutter widget goes here</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
