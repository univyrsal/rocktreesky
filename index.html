<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Tree Sky — Fundraiser</title>
  <meta name="description" content="Help Rock Tree Sky reach our $10,000 goal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- Left: thermometer + pay widget, stays in place while the info scrolls -->
    <aside class="sidebar">
      <!-- Numbers come from progress.json (updated by the GitHub Action) -->
      <section class="meter" aria-label="Fundraising progress">
        <div class="totals">
          <p class="raised">$0</p>
          <p>raised of <span class="goal">$10,000</span></p>
          <p class="donors"></p>
        </div>

        <div class="thermometer" role="progressbar" aria-valuemin="0" aria-valuemax="10000" aria-valuenow="0" aria-label="Amount raised">
          <div class="tube">
            <div class="track">
              <div class="fill"></div>
              <div class="scale" aria-hidden="true"></div>
            </div>
          </div>
          <div class="bulb"><div class="bulb-fill"></div></div>
        </div>
      </section>

      <!-- Givebutter widget: paste your widget snippet here (see README) -->
      <section class="donate" aria-label="Donate">
        <div class="widget-placeholder">Givebutter widget goes here</div>
      </section>
    </aside>

    <!-- Right: the info, scrolls normally -->
    <main class="info">
      <h1>Rock Tree Sky</h1>
      <p class="tagline">Help us reach our goal.</p>

      <!-- EDIT: replace with your own story -->
      <p>Tell people what the money is for and why it matters. A few sentences is plenty.</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
