<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Tree Sky — Fundraiser</title>
  <meta name="description" content="Help Rock Tree Sky reach our $10,000 goal.">
  <!-- Fonts are added by script.js from the Fonts section of settings.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel-right">
  <div class="layout">
    <!-- Thermometer + donation form, stays in place while the info scrolls
         (which side it's on: PANEL_SIDE in settings.md) -->
    <aside class="sidebar">
      <!-- Numbers come from progress.json (updated by the GitHub Action) -->
      <section class="meter" aria-label="Fundraising progress">
        <div class="totals">
          <p class="raised">$0</p>
          <p class="raised-label">raised of $10,000</p>
          <p class="donors"></p>
        </div>

        <div class="thermometer" role="progressbar" aria-valuemin="0" aria-valuemax="10000" aria-valuenow="0" aria-label="Amount raised">
          <div class="tube">
            <div class="track">
              <div class="fill"></div>
              <div class="scale" aria-hidden="true"></div>
            </div>
          </div>
          <div class="bulb"><div class="bulb-fill"></div></div>
        </div>
      </section>

      <!-- Zeffy donation form: script.js puts it here from ZEFFY_FORM_LINK in settings.md -->
      <section class="donate" aria-label="Donate">
        <div class="form-placeholder">Zeffy donation form goes here<br>(add its link to ZEFFY_FORM_LINK in settings.md)</div>
      </section>
    </aside>

    <!-- The info, scrolls normally. Its text comes from content.md;
         what's written here only shows if that can't load. -->
    <main class="info">
      <div class="content">
        <h1>Rock Tree Sky</h1>
        <p>Help us reach our goal.</p>
      </div>
    </main>
  </div>

  <script src="markdown.js"></script>
  <script src="script.js"></script>
</body>
</html>
